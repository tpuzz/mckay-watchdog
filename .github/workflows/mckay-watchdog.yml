name: McKay fine-product workflow watchdog
on:
  push:
    branches: [main]
    paths: ['watchdog/start.signal']
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: mckay-fine-workflow-supervisor
  cancel-in-progress: true
jobs:
  supervise:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Check recovery decisions
        run: python -m unittest discover -s watchdog -p 'test_*.py' -v
      - name: Supervise current McKay fine-product workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          signal_path = Path('watchdog/start.signal')
          signal = json.loads(signal_path.read_text()) if signal_path.exists() else {}
          command = ['python', 'watchdog/supervisor.py']
          if os.environ['GITHUB_EVENT_NAME'] == 'push' and signal.get('signal') == 'NON_MATHEMATICAL_EVENT_PATH_TEST':
              command += ['--diagnostic-event', signal['diagnostic_id']]
          subprocess.run(command, check=True)
          PY

